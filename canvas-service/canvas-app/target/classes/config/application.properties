server.port=8006
spring.main.web-application-type=servlet
app.name=canvas-service
app.alias=canvas-service
app.version=1.0.0
app.group=bontal-canvas
app.server.port=8006
app.scanpackage.service=com.hundsun
rpc.consumer.timeout=7200000
app.registry.address=127.0.0.1:2181
server.servlet.context-path=/canvas-service
rpc.protocol.port=7006
rpc.trace.log=false
rpc.monitor.collect.type=both
rpc.protocol.charset=utf-8
rpc.monitor.enable=false
#logging.config=classpath:config/log4j2.xml
config.location=classpath:config/middleware.properties
rpc.consumer.loadbalance=localrandom

rpc.registry.username=dev
rpc.registry.password=E(11D19F4D1DA7F112B525FFC9828F1C9FB9CBFF63E52C62E0)

ta.enableAppSeq=
ta.enableLog=true

encrypt.algorithm=MD5

log4j.filter.switch=true
log4j.filter.keys=password,passwd,password1,password2,account_num,psswdValue

ta.columnPruningEnable=

ta.skipJsonTransfer=eventData,jsonStr,req_str

mybatis-plus.mapper-locations[0]=classpath*:/mybatis/mappers/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=false
mybatis-plus.configuration.typeEnumsPackage=com.hundsun.bontal.**.type
mybatis-plus.configuration.defaultEnumTypeHandler=com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

# 画布-产品工厂双向同步开关（true=启用，false=关闭，默认关闭）
# 关闭时：定时拉取/回写不执行、手动同步按钮不生效
canvas.sync.enabled=false
# 拉取同步定时间隔（毫秒），默认 5 分钟
canvas.sync.pull-interval-ms=300000
# 回写同步定时间隔（毫秒），默认 10 分钟
canvas.sync.push-interval-ms=600000
